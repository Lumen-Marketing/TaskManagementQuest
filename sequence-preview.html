<!DOCTYPE html>
<!-- Committed harness for the Category Sequence Board (SequenceLayout). Mirrors
     the app's body.ui-command-center > #taskViewWrap > #listBody.sequence-board
     ID ancestry so a render == the real view. Static markup modelled on
     SequenceLayout.renderRow/renderGroup. Screenshot in light/dark/mobile. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence Board Preview</title>
<link rel="stylesheet" href="taskmanagement.css">
<style>body{padding:24px;}</style>
</head>
<body class="ui-command-center">
  <div id="taskViewWrap">
    <div id="listBody" class="sequence-board">
      <div class="seq-savebar"><button type="button" class="btn btn-primary" data-action="seq-save">Save order</button></div>

      <section class="seq-group" data-cat="invoicing">
        <div class="seq-group-head"><span class="seq-group-name">Invoicing</span><span class="seq-group-count">4 tasks</span></div>
        <div class="seq-group-list" data-cat="invoicing">
          <div class="seq-row" data-id="i1" data-cat="invoicing">
            <button class="seq-grip"><i class="ti ti-grip-vertical"></i></button>
            <span class="seq-badge">1</span>
            <div class="seq-body"><div class="seq-title">Send final invoice — Olvera water damage</div>
              <div class="seq-meta"><span class="seq-pill">Critical</span><span class="due-cell">Jul 28</span></div></div>
            <div class="seq-movers"><button data-action="seq-move" data-dir="-1"><i class="ti ti-chevron-up"></i></button><button data-action="seq-move" data-dir="1"><i class="ti ti-chevron-down"></i></button></div>
          </div>
          <div class="seq-row" data-id="i2" data-cat="invoicing">
            <button class="seq-grip"><i class="ti ti-grip-vertical"></i></button>
            <span class="seq-badge">2</span>
            <div class="seq-body"><div class="seq-title">Draw 2 invoice — Paradise Valley HVAC</div>
              <div class="seq-meta"><span class="seq-pill">High</span><span class="due-cell">Aug 1</span></div></div>
            <div class="seq-movers"><button data-action="seq-move" data-dir="-1"><i class="ti ti-chevron-up"></i></button><button data-action="seq-move" data-dir="1"><i class="ti ti-chevron-down"></i></button></div>
          </div>
          <div class="seq-row" data-id="i3" data-cat="invoicing">
            <button class="seq-grip"><i class="ti ti-grip-vertical"></i></button>
            <span class="seq-badge">3</span>
            <div class="seq-body"><div class="seq-title">Chase CNL Development balance</div>
              <div class="seq-meta"><span class="seq-pill">High</span><span class="due-cell">Jul 29</span></div></div>
            <div class="seq-movers"><button data-action="seq-move" data-dir="-1"><i class="ti ti-chevron-up"></i></button><button data-action="seq-move" data-dir="1"><i class="ti ti-chevron-down"></i></button></div>
          </div>
        </div>
      </section>

      <section class="seq-group" data-cat="admin">
        <div class="seq-group-head"><span class="seq-group-name">Admin</span><span class="seq-group-count">3 tasks</span></div>
        <div class="seq-group-list" data-cat="admin">
          <div class="seq-row" data-id="a1" data-cat="admin">
            <button class="seq-grip"><i class="ti ti-grip-vertical"></i></button>
            <span class="seq-badge">1</span>
            <div class="seq-body"><div class="seq-title">Renew ROC bond paperwork</div>
              <div class="seq-meta"><span class="seq-pill">Medium</span><span class="due-cell">Aug 4</span></div></div>
            <div class="seq-movers"><button data-action="seq-move" data-dir="-1"><i class="ti ti-chevron-up"></i></button><button data-action="seq-move" data-dir="1"><i class="ti ti-chevron-down"></i></button></div>
          </div>
          <div class="seq-row" data-id="a2" data-cat="admin">
            <button class="seq-grip"><i class="ti ti-grip-vertical"></i></button>
            <span class="seq-badge">2</span>
            <div class="seq-body"><div class="seq-title">Payroll approval — week 31</div>
              <div class="seq-meta"><span class="seq-pill">High</span><span class="due-cell">Jul 30</span></div></div>
            <div class="seq-movers"><button data-action="seq-move" data-dir="-1"><i class="ti ti-chevron-up"></i></button><button data-action="seq-move" data-dir="1"><i class="ti ti-chevron-down"></i></button></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
